<!DOCTYPE html>

<head>

<title>AI 빈티지 디스커버리 태그 · 3D 체험</title>
<style>
@font-face{font-family:'PretendardLocal';font-weight:300;src:local('Pretendard Light'),url('../assets/fonts/Pretendard-Light.woff2') format('woff2')}
@font-face{font-family:'PretendardLocal';font-weight:400;src:local('Pretendard Regular'),url('../assets/fonts/Pretendard-Regular.woff2') format('woff2')}
@font-face{font-family:'PretendardLocal';font-weight:500;src:local('Pretendard Medium'),url('../assets/fonts/Pretendard-Medium.woff2') format('woff2')}
@font-face{font-family:'PretendardLocal';font-weight:600;src:local('Pretendard SemiBold'),url('../assets/fonts/Pretendard-SemiBold.woff2') format('woff2')}

<style>
/* VOICE: 조용한 제품 쇼케이스, 만져보는 데모
   IDEA: 동묘시장 진열대 위에 놓인 실물 태그와 회중시계
   PICTURE: 화면을 가득 채운 3D 스튜디오 — 직접 끌고 내리는 태그
   COLOUR and TYPE: 웜 화이트 + 커버의 그린 그레이, 인식 빛의 빨강 한 점 / IBM Plex Sans KR
   LAYOUT: 위에 3D 무대, 아래에 사용 단계와 화면 내용 편집 */
:root{color-scheme:light dark;
  --bg:light-dark(#ecebe8,#141716);--panel:light-dark(#f7f6f3,#1c201f);--ink:light-dark(#1d2422,#e9e7e3);
  --mute:light-dark(#5e6662,#a3aba7);--line:light-dark(#d6d4cf,#2e3432);--green:light-dark(#5f6f6a,#8fa39c);
  --red:#e3261b;--chip:light-dark(rgba(255,255,255,.85),rgba(20,23,22,.82))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PretendardLocal","PretendardLocal",system-ui,sans-serif;overflow-x:clip}
header{padding:22px max(4vw,16px) 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-size:clamp(24px,3.2vw,34px);line-height:1.1;margin:0;font-weight:600;text-wrap:balance}
header p{margin:0;color:var(--mute)}
html,body{height:100%}body{overflow:hidden}
.stage{position:relative;height:100%;margin:0;overflow:hidden;background:#c9c9cc;touch-action:none}
.tools{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.tools button{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.55);color:#3D2E21;font:500 13px "PretendardLocal",sans-serif;cursor:pointer;backdrop-filter:blur(6px)}
.off{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:#D2D2D4 url('assets/images/product-rendering-main.webp') center/contain no-repeat;color:#3D2E21}
.off p{background:rgba(255,255,255,.8);padding:12px 18px;font-size:14px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--chip);font-weight:500;font-size:15px;backdrop-filter:blur(6px)}
.dot{width:10px;height:10px;border-radius:50%;background:#9aa19e;transition:background .3s}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:var(--chip);font-size:15px;max-width:calc(100% - 32px);text-align:center;backdrop-filter:blur(6px)}
.bubble{position:absolute;left:0;top:0;padding:10px 14px;border-radius:14px;background:#fff;color:#1d2422;font-weight:500;font-size:15px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.14);opacity:0;transform:translate(14px,-50%) scale(.9);transition:opacity .35s,transform .35s;pointer-events:none}
.bubble::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:#fff}
.bubble.on{opacity:1;transform:translate(14px,-50%) scale(1)}
.load{position:absolute;inset:0;display:grid;place-items:center;color:#3b4240;font-weight:500;background:#c9c9cc}
.panel{display:grid;grid-template-columns:minmax(0,640px);gap:18px;padding:18px max(4vw,16px) 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
h2{font-size:18px;margin:0 0 12px;font-weight:600}
.rail{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.rail button{display:inline-flex;align-items:center;gap:8px;height:34px;min-height:34px;min-width:34px;padding:0 4px;border-radius:17px;border:0;background:#5f6f6a;color:#f3eee2;font:500 14px "PretendardLocal",sans-serif;box-shadow:inset 0 0 0 1px rgba(243,238,226,.32),0 4px 12px rgba(28,36,33,.18);transition:padding .3s,opacity .25s,transform .2s}
.rail .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;transition:background .3s,color .3s}
.rail .lb{display:none;font:500 13px "PretendardLocal",sans-serif;white-space:nowrap;letter-spacing:-.01em}
.rail button.now{padding:0 14px 0 4px}.rail button.now .n{background:#f3eee2;color:#4e5d58}.rail button.now .lb{display:inline}
.rail button.done{opacity:.6}
.rail button:hover,.rail button:focus-visible{transform:translateX(2px)}
.rail button:disabled{opacity:.4;cursor:default;transform:none}
.cursor{position:absolute;left:0;top:0;width:28px;height:28px;margin:-3px 0 0 -4px;pointer-events:none;opacity:0;transition:opacity .2s;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.ripple{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2.5px solid #f3eee2;pointer-events:none;opacity:0}
.tip{position:absolute;left:62px;width:min(280px,calc(100% - 96px));padding:16px 18px 14px;border-radius:18px;color:#1d2422;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.07) 46%,rgba(255,255,255,.14) 100%);
  border:1px solid rgba(255,255,255,.62);
  -webkit-backdrop-filter:blur(10px) saturate(1.7) brightness(1.04);backdrop-filter:blur(10px) saturate(1.7) brightness(1.04);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 1px 0 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.22),inset 0 0 22px rgba(255,255,255,.14),0 10px 28px rgba(24,32,44,.16);
  opacity:0;transform:translate(-6px,-50%);transition:opacity .22s,transform .22s;pointer-events:none}
.tip::before{content:"";position:absolute;left:-30%;top:-60%;width:90%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:.55;pointer-events:none}
.tip::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.28) 46%,transparent 54%);pointer-events:none}
.tip.on{opacity:1;transform:translate(0,-50%)}
.tip>*{position:relative;z-index:1}
.tip-top{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.tip-n{font:300 30px/1 "PretendardLocal",sans-serif;letter-spacing:-.02em;color:#2c3532}
.tip-of{font:500 12px "PretendardLocal",sans-serif;color:#6b7470}
.tip-kind{margin-left:auto;padding:3px 9px;border-radius:99px;font:500 12px "PretendardLocal",sans-serif;color:#2f3c38;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6)}
.tip b{display:block;font:600 16px/1.3 "PretendardLocal",sans-serif;letter-spacing:-.01em;margin-bottom:4px}
.tip .desc{display:block;font-size:13.5px;line-height:1.5;color:#3b4441}
.tip-act{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.45);font-size:12.5px;color:#4e5d58}
.tip-act i{font-style:normal;padding:2px 8px;border-radius:6px;background:#5f6f6a;color:#f3eee2;font:500 12px "PretendardLocal",sans-serif}
.guide{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
input,select{font:16px "PretendardLocal",sans-serif;padding:10px 12px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:light-dark(#fff,#131615);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{font:500 15px "PretendardLocal",sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:light-dark(#fff,#232826);color:var(--ink);cursor:pointer}
button.pri{background:var(--green);border-color:var(--green);color:#fff}
.note{margin:14px 0 0;font-size:13px;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}.seg span{font-size:13px;color:var(--mute);margin-right:4px}
.seg button[aria-pressed=true]{background:light-dark(#e3e8e5,#26302d);border-color:var(--green);color:var(--ink)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="tools"><button id="bReset">처음부터 다시</button><button id="bCam">시점 초기화</button></div>
  <div class="load" id="load">모델 불러오는 중…</div>
  <div class="chip"><span class="dot" id="dot"></span><span id="status">대기</span></div>
  <div class="hint" id="hint">태그를 끌어서 끈 끝을 시계 고리에 가져다 대보세요</div>
  <div class="bubble" id="bubble"></div>
  <div class="ripple" id="gRipple"></div>
  <svg class="cursor" id="gCursor" viewBox="0 0 28 28"><path d="M5 3 L5 22 L10 17 L13.5 25 L17 23.5 L13.5 16 L20.5 16 Z" fill="#fff" stroke="#1d2422" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div class="rail" id="rail" aria-label="사용 순서"></div>
  <div class="tip" id="tip"></div>
</div>

<div hidden><input id="fPrice" value="₩150,000"><select id="fDots"><option>4</option></select><input id="fName" value="Brass Pocket Watch"><input id="fYear" value="c. 1960s"></div>

<div class="off" id="offline"><p>3D 체험은 인터넷에 연결되어 있을 때 동작해요.</p></div>
<script src="assets/models/tag-experience-model.js" defer></script>
<script>
// 3D 엔진(three.js)을 인터넷에서 불러오지 못하면 안내 화면 표시
setTimeout(() => { if (!window.__tagExpReady) { const o = document.getElementById('offline'); if (o) o.style.display = 'grid'; } }, 9000);
</script>
<script type="importmap">

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';

{
window.__tagExpReady = true;
const $ = id => document.getElementById(id);
const stage = $('stage');
const GROUND = 0.0157, OPEN = 0.008;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;   // 부드러운 가감속

// ---------- 장면 ----------
const renderer = new THREE.WebGLRenderer({antialias:true});

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9c9cc);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 10);
const CAM0 = new THREE.Vector3(0.26, 0.30, 0.62), TGT0 = new THREE.Vector3(0.05, 0.11, -0.12);
camera.position.copy(CAM0);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(-0.3, 0.7, 0.25); sun.castShadow = true;
Object.assign(sun.shadow.camera, {left:-0.55, right:0.55, top:0.55, bottom:-0.55, near:0.1, far:2.5});
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
scene.add(sun, new THREE.HemisphereLight(0xffffff, 0x9a9a9e, 0.35));

// 가판대: 손님이 그 너머에 서 있음
const ground = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.04, 0.62), new THREE.MeshStandardMaterial({color:0xc4c4c8, roughness:0.92}));
ground.position.set(0.05, GROUND - 0.02, -0.03); ground.receiveShadow = true; ground.castShadow = true;
scene.add(ground);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.6, 0.55, 1.1);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function addMesh(parent, geo, mat, p = [0, 0, 0], r = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat); m.position.set(...p); m.rotation.set(...r);
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}

// ---------- 회중시계 ----------
const watch = new THREE.Group(); watch.position.set(0.17, GROUND, -0.07); scene.add(watch);
const brass = new THREE.MeshStandardMaterial({color:0xc9a25a, metalness:1, roughness:0.28});
const dialCv = document.createElement('canvas'); dialCv.width = dialCv.height = 512;
{
  const g = dialCv.getContext('2d');
  g.fillStyle = '#f3ead8'; g.fillRect(0, 0, 512, 512); g.translate(256, 256); g.fillStyle = '#2b2118';
  for (let i = 0; i < 60; i++) { g.save(); g.rotate(i * Math.PI / 30); const b = i % 5 === 0;
    g.fillRect(-(b ? 5 : 2), -238, b ? 10 : 4, b ? 34 : 14); g.restore(); }
  g.font = '500 58px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  ['12','3','6','9'].forEach((t, i) => { const a = i * Math.PI / 2; g.fillText(t, Math.sin(a) * 160, -Math.cos(a) * 160); });
  g.lineCap = 'round'; g.strokeStyle = '#2b2118';
  g.lineWidth = 12; g.beginPath(); g.moveTo(0, 0); g.lineTo(-70, -95); g.stroke();
  g.lineWidth = 7; g.beginPath(); g.moveTo(0, 0); g.lineTo(150, -60); g.stroke();
  g.beginPath(); g.arc(0, 0, 12, 0, 7); g.fill();
}
const dialTex = new THREE.CanvasTexture(dialCv); dialTex.colorSpace = THREE.SRGBColorSpace;
addMesh(watch, new THREE.CylinderGeometry(0.024, 0.024, 0.009, 72), brass, [0, 0.0045, 0]);
addMesh(watch, new THREE.TorusGeometry(0.0232, 0.0019, 16, 72), brass, [0, 0.009, 0], [-Math.PI / 2, 0, 0]);
addMesh(watch, new THREE.CircleGeometry(0.0214, 72), new THREE.MeshStandardMaterial({map:dialTex, roughness:0.45}), [0, 0.0093, 0], [-Math.PI / 2, 0, Math.PI / 2]);
addMesh(watch, new THREE.CylinderGeometry(0.0022, 0.0022, 0.005, 24), brass, [-0.026, 0.0045, 0], [0, 0, Math.PI / 2]);
addMesh(watch, new THREE.CylinderGeometry(0.0034, 0.0034, 0.003, 24), brass, [-0.0295, 0.0045, 0], [0, 0, Math.PI / 2]);
const bowMat = brass.clone(); bowMat.emissiveIntensity = 0;
const bow = addMesh(watch, new THREE.TorusGeometry(0.0062, 0.0012, 14, 40), bowMat, [-0.0365, 0.0045, 0], [-Math.PI / 2, 0, 0]);
const BOW = new THREE.Vector3(-0.0365, 0.0045, 0).add(watch.position);

// ---------- 손님: 사람 몸을 도형으로 단순화한 3D 피규어 (표정 있음) ----------
// 기준점 = 가판대 윗면 높이의 몸 중앙. 두 손은 가판대 위에 올려둠
const guest = new THREE.Group(); guest.position.set(-0.03, GROUND, -0.40); scene.add(guest);
const M = c => new THREE.MeshStandardMaterial({color:c, roughness:0.75});
const jacket = M(0x7d6b58), shirt = M(0xe6e0d4), skin = M(0xe5c09d), hairM = M(0x372e29), ink = M(0x221c19), blush = M(0xe7a191);
const Yv = new THREE.Vector3(0, 1, 0);
function limb(parent, a, b, r, mat) {                    // 두 점을 잇는 캡슐(팔 마디)
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const m = addMesh(parent, new THREE.CapsuleGeometry(r, d.length(), 8, 20), mat);
  m.position.copy(A).add(B).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(Yv, d.normalize()); return m;
}
{
  // 날씬한 상체: 어깨가 비스듬히 내려와 팔로 이어지는 실루엣
  const prof = [[0,-0.08],[0.058,-0.08],[0.06,0],[0.063,0.07],[0.066,0.12],[0.064,0.148],[0.056,0.168],[0.04,0.184],[0.02,0.196],[0,0.2]]
    .map(([r, y]) => new THREE.Vector2(r, y));
  const torso = addMesh(guest, new THREE.LatheGeometry(prof, 64), jacket); torso.scale.z = 0.6;
  const v = new THREE.Shape(); v.moveTo(-0.017, 0.04); v.lineTo(0.017, 0.04); v.lineTo(0, -0.035); v.lineTo(-0.017, 0.04);
  addMesh(guest, new THREE.ShapeGeometry(v), shirt, [0, 0.142, 0.0385], [-0.2, 0, 0]);
  addMesh(guest, new THREE.BoxGeometry(0.022, 0.009, 0.005), shirt, [-0.011, 0.184, 0.024], [0.6, 0, 0.5]);
  addMesh(guest, new THREE.BoxGeometry(0.022, 0.009, 0.005), shirt, [0.011, 0.184, 0.024], [0.6, 0, -0.5]);
  addMesh(guest, new THREE.CylinderGeometry(0.0145, 0.016, 0.036, 24), skin, [0, 0.21, 0]);
  for (const sx of [-1, 1]) {
    // 어깨 관절을 몸통 안쪽에 두고 팔 굵기와 같은 둥근 끝으로 이어서, 어깨와 팔이 한 덩어리처럼 보이게

    limb(guest, sh, el, 0.0165, jacket);
    limb(guest, el, wr, 0.015, jacket);
    addMesh(guest, new THREE.CylinderGeometry(0.0162, 0.0162, 0.007, 20), shirt, [wr[0], wr[1] + 0.002, wr[2] - 0.003], [1.25, 0, 0]);
    const hand = addMesh(guest, new THREE.SphereGeometry(0.0145, 24, 16), skin, [sx * 0.059, 0.010, 0.111]); hand.scale.set(1, 0.55, 1.35);
    limb(guest, [sx * 0.05, 0.011, 0.104], [sx * 0.043, 0.009, 0.12], 0.0048, skin);   // 엄지
  }
}
const head = new THREE.Group(); head.position.set(0, 0.212, 0.002); guest.add(head);   // 목을 축으로 끄덕임
const face = {};
{
  const sk = addMesh(head, new THREE.SphereGeometry(0.04, 48, 32), skin, [0, 0.05, 0]); sk.scale.set(0.92, 1.08, 0.95);
  addMesh(head, new THREE.SphereGeometry(0.0425, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.5), hairM, [0, 0.056, -0.003], [-0.35, 0, 0]);
  for (const sx of [-1, 1]) { const e = addMesh(head, new THREE.SphereGeometry(0.009, 16, 12), skin, [sx * 0.037, 0.048, 0]); e.scale.set(0.5, 1, 0.8); }
  const nose = addMesh(head, new THREE.SphereGeometry(0.0055, 16, 12), skin, [0, 0.046, 0.039]); nose.scale.set(0.9, 1, 1.1);
  face.eyes = [-1, 1].map(sx => { const e = addMesh(head, new THREE.SphereGeometry(0.0046, 16, 12), ink, [sx * 0.0135, 0.056, 0.0345]); e.scale.set(1, 1.2, 0.6); return e; });
  face.happyEyes = [-1, 1].map(sx => addMesh(head, new THREE.TorusGeometry(0.0055, 0.0013, 8, 20, Math.PI), ink, [sx * 0.0135, 0.0545, 0.0352]));

  ['손님에게 보여주기', '가격이 뜬 상태에서 가판대 너머의 손님을 한 번 클릭해요. 태그가 손님 쪽으로 기울어 가격을 보여줘요.', 'tap', '손님 클릭'],
  ['커버 닫기', '초록 커버를 꾹 누른 채 위로 밀어 닫아요. 제품명·연도·가치가 나와요.', 'drag', '커버 닫기'],
  ['리셋', '커버를 아래로 내렸다가 다시 위로 닫아요. 화면이 꺼지고 처음 상태로 돌아가요.', 'downup', '리셋'],
];
let auto = false, guideStep = 0, guideT = 0;
const rail = $('rail'), tip = $('tip');
rail.innerHTML = STEPS.map((st, i) => `<button data-s="${i + 1}" aria-label="${i + 1}단계 ${st[0]}"><span class="n">${i + 1}</span><span class="lb">${st[3]}</span></button>`).join('');
rail.querySelectorAll('button').forEach(b => {
  const i = +b.dataset.s;
  const on = () => { if (auto || camShot) return; guideStep = i; guideT = 0; startHover(i);
    const kind = {drag:'드래그', tap:'클릭', downup:'내렸다 올리기'}[STEPS[i - 1][2]];
    tip.innerHTML = `<div class="tip-top"><span class="tip-n">0${i}</span><span class="tip-of">/ 0${STEPS.length}</span><span class="tip-kind">${kind}</span></div>`
      + `<b>${STEPS[i - 1][0]}</b><span class="desc">${STEPS[i - 1][1]}</span>`
      + `<div class="tip-act"><i>번호 클릭</i>이 단계를 자동으로 보여줘요</div>`;
    tip.style.top = (b.offsetTop + b.offsetHeight / 2 + rail.offsetTop - rail.offsetHeight / 2) + 'px';
    tip.style.left = (rail.offsetLeft + b.offsetWidth + 12) + 'px'; tip.classList.add('on'); };
  const off = () => { guideStep = 0; tip.classList.remove('on'); endHover(); };
  b.addEventListener('pointerenter', on); b.addEventListener('focus', on);
  b.addEventListener('pointerleave', off); b.addEventListener('blur', off);
  b.addEventListener('click', () => runStep(i));
});
const wait = ms => new Promise(r => setTimeout(r, ms));
const waitUntil = (fn, max = 8000) => new Promise(r => { const t0 = performance.now();
  const id = setInterval(() => { if (fn() || performance.now() - t0 > max) { clearInterval(id); r(); } }, 50); });
async function ensureAttached() {
  if (attached) return;
  const rot = -Math.PI / 2, sv = strapTip.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), rot);
  snapAnim = {t:0, p0:tag.position.clone(), r0:tag.rotation.y, p1:new THREE.Vector3(BOW.x - sv.x, 0, BOW.z - sv.z), r1:rot};
  await waitUntil(() => !snapAnim); await wait(250);
}
async function autoCover(open) {
  coverTarget = open ? OPEN : 0; await wait(420);
  if (coverOpen !== open) { coverOpen = open; onCover(open); }
}
async function freshStart() {
  if (state === 'off' && !coverOpen) return;
  coverTarget = 0; coverOpen = false; pendingReset = false; setState('off'); await wait(650);
}
async function ensurePrice() {
  if (state === 'price') return;
  await ensureAttached(); await freshStart(); await autoCover(true);
  await waitUntil(() => state === 'price'); await wait(500);
}
async function runStep(i) {
  if (auto || !cover || show || camShot || drag) return;
  auto = true; guideStep = 0; tip.classList.remove('on'); endHover();
  await waitUntil(() => !hoverCam, 2000);
  rail.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    if (i === 1) await ensureAttached();
    if (i === 2) { await ensureAttached(); await freshStart(); await autoCover(true); }
    if (i === 3) { await ensurePrice(); showGuest(); await waitUntil(() => !show && !camShot); }
    if (i === 4) { await ensurePrice(); await autoCover(false); }
    if (i === 5) { if (state !== 'detail') { await ensurePrice(); await autoCover(false); await wait(1100); }
      await autoCover(true); await wait(700); await autoCover(false); }

}
// ---------- 가이드 애니메이션: 해당 부분으로 클로즈업 + 반투명 실루엣이 동작을 시범 ----------
const ghostMat = new THREE.MeshBasicMaterial({color:0xfffaf0, transparent:true, opacity:0, depthWrite:false, depthTest:false});
const ghostCoverMat = new THREE.MeshBasicMaterial({color:0x9fe0c4, transparent:true, opacity:0, depthWrite:false, depthTest:false});
const ghostScrMat = new THREE.MeshBasicMaterial({color:0xff3b2a, transparent:true, opacity:0, depthWrite:false, depthTest:false, toneMapped:false});
let ghost = null, ghostCover = null, ghostParts = [];
function buildGhost() {
  ghost = new THREE.Group();
  for (const ch of tag.children) {
    if (ch === disp || ch === glowLight || !ch.isMesh || !ch.visible) continue;
    const c = new THREE.Mesh(ch.geometry, ch === cover ? ghostCoverMat : ghostMat);
    c.position.copy(ch.position); c.quaternion.copy(ch.quaternion); c.scale.copy(ch.scale); c.renderOrder = ch === cover ? 7 : 5;
    if (ch === cover) ghostCover = c; else ghostParts.push(c);
    ghost.add(c);
  }
  const gs = new THREE.Mesh(new THREE.CircleGeometry(screenR, 64), ghostScrMat);
  gs.rotation.x = -Math.PI / 2; gs.position.copy(screenC); gs.position.y += 0.0003; gs.renderOrder = 8; ghost.add(gs);
  ghost.visible = false; scene.add(ghost);
}
let hoverCam = null;                                     // {on, p0, t0, p1, t1}
function closeup(i) {
  const tipW = tag.localToWorld(strapTip.clone());
  const coverW = tag.localToWorld(new THREE.Vector3(screenC.x, 0.03, coverBaseZ + 0.05));
  if (i === 1) { const t = tipW.clone().lerp(BOW, 0.5); return [t.clone().add(new THREE.Vector3(0.06, 0.15, 0.17)), t]; }
  if (i === 3) {
    const headW = new THREE.Vector3(0, 0.26, 0).applyMatrix4(guest.matrixWorld);
    const t = tag.position.clone().add(new THREE.Vector3(0, 0.05, 0)).lerp(headW, 0.55);
    const dir = new THREE.Vector3().subVectors(tag.position, guest.position).setY(0).normalize();
    return [tag.position.clone().addScaledVector(dir, 0.32).add(new THREE.Vector3(0.1, 0.15, 0)), t];
  }
  return [coverW.clone().add(new THREE.Vector3(0.09, 0.13, 0.13)), coverW];
}
function startHover(i) {
  if (auto || camShot || drag || !cover) return;
  const [p1, t1] = closeup(i);
  if (!hoverCam) hoverCam = {p0:camera.position.clone(), t0:controls.target.clone()};
  Object.assign(hoverCam, {on:true, p1, t1}); controls.enabled = false;
}
function endHover() { if (hoverCam) hoverCam.on = false; }
const gCur = $('gCursor'), gRip = $('gRipple');
function placeAt(el, w) { const q = w.clone().project(camera);
  el.style.left = (q.x + 1) / 2 * stage.clientWidth + 'px'; el.style.top = (1 - q.y) / 2 * stage.clientHeight + 'px'; }
function guideCursor(g) {                                 // 마우스 커서가 실제로 누르고 끄는 모습
  if (!guideStep) { gCur.style.opacity = 0; gRip.style.opacity = 0; return; }
  let w, press = 0;
  if (guideStep === 3) {
    const chest = new THREE.Vector3(0.02, 0.13, 0.04).applyMatrix4(guest.matrixWorld);
    const from = chest.clone().add(new THREE.Vector3(0.09, -0.06, 0.08));
    w = from.lerp(chest, ease(THREE.MathUtils.clamp((g - 0.2) / 0.5, 0, 1)));
    press = g > 0.75 && g < 1.25 ? (g - 0.75) / 0.5 : 0;
  } else if (guideStep === 1) {
    w = ghost.localToWorld(new THREE.Vector3(screenC.x + 0.01, 0.03, screenC.z + 0.01)); press = g > 0.3 && g < 1.7 ? 0.5 : 0;
  } else {
    w = ghost.localToWorld(new THREE.Vector3(screenC.x + 0.006, 0.031, ghostCover.position.z + 0.044)); press = g > 0.25 && g < 2.2 ? 0.5 : 0;
  }
  placeAt(gCur, w); placeAt(gRip, w);
  const vis = smooth(0, 0.2, g) * (1 - smooth(2.4, 2.7, g));
  gCur.style.opacity = vis; gCur.style.transform = `scale(${press ? 0.86 : 1})`;
  const rp = guideStep === 3 ? press : (press ? (g * 1.6) % 1 : 0);
  gRip.style.opacity = rp ? (1 - rp) * vis : 0; gRip.style.transform = `scale(${0.4 + rp * 0.9})`;
}
function animGhost(dt) {
  if (!ghost) return;
  if (!guideStep) { ghost.visible = false; guideCursor(0); return; }
  guideT = (guideT + dt) % 2.8; const g = guideT;
  const a = smooth(0, 0.35, g) * (1 - smooth(2.3, 2.75, g));            // 서서히 나타났다 사라짐
  const mv = ease(THREE.MathUtils.clamp((g - 0.4) / 1.2, 0, 1));         // 동작 진행도
  ghost.visible = true;
  ghost.position.copy(tag.position); ghost.quaternion.copy(tag.quaternion);
  ghostCover.position.z = cover.position.z; ghostScrMat.opacity = 0;
  const allParts = guideStep === 1 || guideStep === 3;
  ghostParts.forEach(m => m.visible = allParts);
  ghostMat.opacity = 0.5 * a; ghostCoverMat.opacity = 0.85 * a;
  if (guideStep === 1) {                                   // 실루엣이 끈 끝을 시계 고리로 가져가 거는 모습
    const rot = -Math.PI / 2, sv = strapTip.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), rot);
    const p1 = new THREE.Vector3(BOW.x - sv.x, 0, BOW.z - sv.z);

    ghost.position.y = 0.035 * k;
    if (!nod) head.rotation.x = g > 1.6 && g < 2.3 ? 0.3 * Math.sin((g - 1.6) / 0.35 * Math.PI) ** 2 : head.rotation.x * 0.85;   // 손님이 끄덕이는 미리보기
  } else {                                                 // 커버 실루엣이 레일을 따라 내려가고 / 올라감
    const base = coverBaseZ;

      : OPEN * (g < 1.2 ? ease(THREE.MathUtils.clamp((g - 0.3) / 0.8, 0, 1)) : 1 - ease(THREE.MathUtils.clamp((g - 1.3) / 0.8, 0, 1)));

// ---------- 크기 · 매 프레임 ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.resolution.set(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

const clock = new THREE.Clock(), v = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0), prevPos = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); stateT += dt;
  const f = k => 1 - Math.exp(-k * dt);                 // 프레임과 상관없이 부드럽게 따라가기
  if (cover) {
    const want = drag?.kind === 'cover' ? (drag.want ?? cover.position.z - coverBaseZ) : coverTarget;
    cover.position.z += (coverBaseZ + want - cover.position.z) * f(drag ? 22 : 10);
  }
  if (drag?.kind === 'tag') {
    tag.position.x += (drag.tx - tag.position.x) * f(18);
    tag.position.z += (drag.tz - tag.position.z) * f(18);
    tag.position.y += (0.006 - tag.position.y) * f(12);
  }
  if (snapAnim) {
    snapAnim.t = Math.min(1, snapAnim.t + dt / 0.55); const k = ease(snapAnim.t);
    tag.position.lerpVectors(snapAnim.p0, snapAnim.p1, k);
    tag.rotation.y = lerp(snapAnim.r0, snapAnim.r1, k);
    if (snapAnim.t >= 1) { if (!snapAnim.free) { attached = true; updateSteps(); } snapAnim = null; }
  }

    show.t = Math.min(SHOW_T, show.t + dt);
    const k = smooth(0.4, 1.3, show.t) * (1 - smooth(3.1, 3.9, show.t));   // 들어서 기울이고 → 잠시 유지 → 내려놓기
    tag.quaternion.setFromAxisAngle(Y, show.yaw).premultiply(new THREE.Quaternion().setFromAxisAngle(show.axis, 0.55 * k));
    tag.position.y = 0.035 * k;
    if (show.t >= SHOW_T) { tag.rotation.set(0, show.yaw, 0); tag.position.y = 0; show = null;
      if (watch.parent !== scene) { tag.updateMatrixWorld(true); scene.attach(watch); } }
  }

  const bl = blinkT < 0 ? Math.max(0.12, Math.abs(blinkT + 0.07) / 0.07) : 1;
  face.eyes.forEach(o => o.scale.y = 1.2 * Math.min(1, bl)); if (blinkT < -0.14) blinkT = 2.5 + Math.random() * 3;
  guest.rotation.y += (THREE.MathUtils.clamp(Math.atan2(camera.position.x - guest.position.x, camera.position.z - guest.position.z), -0.5, 0.5) - guest.rotation.y) * f(4);
  if (nod) {                                             // 손님: 만족이면 두 번 끄덕, 아니면 갸웃

    if (!nod.set && t > -0.2) { setExpr(nod.happy ? 'happy' : 'curious'); nod.set = true; }
    head.rotation.x = nod.happy && t > 0 && t < 1.2 ? 0.38 * Math.sin(t * Math.PI * 2 / 0.6) ** 2 : head.rotation.x * (1 - f(8));
    head.position.y = 0.212 - head.rotation.x * 0.012;
    head.rotation.z = !nod.happy && t > 0 && t < 1.4 ? 0.16 * Math.sin(Math.min(1, t / 1.4) * Math.PI) : head.rotation.z * (1 - f(8));
    guest.position.y = GROUND + (nod.happy && t > 0 && t < 1.2 ? 0.004 * Math.abs(Math.sin(t * Math.PI * 2 / 0.6)) : 0);

  } else b.classList.remove('on');

    controls.target.lerpVectors(camShot.t0, camShot.t1, k);
    camera.lookAt(controls.target);

  }
