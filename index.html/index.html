<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="TEAM06/assets/fonts/pretendard-offline.js"></script>
<title>2030 FUTURE WORLD · 프로젝트 소개</title>
<!--
  ※ 임시 프로젝트 소개 페이지입니다.
     수업에서 전체 프로젝트 소개 페이지(index.html)를 받으면 이 파일을 교체하세요.
     교체한 페이지에서 TEAM06/index.html 로 가는 링크만 있으면 조 페이지와 연결돼요.
-->
<style>
@font-face{font-family:'PretendardLocal';font-weight:100;font-display:swap;src:local('Pretendard Thin'),local('Pretendard-Thin'),url('TEAM06/assets/fonts/Pretendard-Thin.woff2') format('woff2');}
@font-face{font-family:'PretendardLocal';font-weight:200;font-display:swap;src:local('Pretendard ExtraLight'),local('Pretendard-ExtraLight'),url('TEAM06/assets/fonts/Pretendard-ExtraLight.woff2') format('woff2');}
@font-face{font-family:'PretendardLocal';font-weight:300;font-display:swap;src:local('Pretendard Light'),local('Pretendard-Light'),url('TEAM06/assets/fonts/Pretendard-Light.woff2') format('woff2');}
@font-face{font-family:'PretendardLocal';font-weight:600;font-display:swap;src:local('Pretendard SemiBold'),local('Pretendard-SemiBold'),url('TEAM06/assets/fonts/Pretendard-SemiBold.woff2') format('woff2');}
:root{--bg:#FFFFFF;--section-bg:#F7EDE1;--text:#3D2E21;--accent:#A2BA75;--nav:#667DAD;--sub:#7D6B5C;--line:#E6DCD0;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PretendardLocal","PretendardEmbed","Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;font-weight:100;font-size:14px;line-height:1.8;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.container{max-width:1440px;margin:0 auto;padding:0 80px}
@media (max-width:768px){.container{padding:0 20px}}
.header{height:80px;border-bottom:1px solid var(--line)}
.header .container{height:100%;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:600;letter-spacing:.06em}
.temp{font-size:14px;font-weight:200;color:var(--nav)}
.eyebrow{font-size:14px;font-weight:100;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.h1{font-size:48px;font-weight:600;line-height:1.3;margin:12px 0 16px}
.h2{font-size:32px;font-weight:300;line-height:1.45}
.h3{font-size:16px;font-weight:200}
.todo{display:inline-block;margin-top:24px;padding:16px 24px;background:var(--section-bg);font-size:16px;font-weight:200}
.intro{padding:96px 0 80px}
@media (max-width:768px){.h1{font-size:32px}.intro{padding:56px 0}}
.s-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:48px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:96px}
@media (max-width:1024px){.teams{grid-template-columns:repeat(2,1fr)}}
@media (max-width:768px){.teams{grid-template-columns:1fr}}
.team .thumb{position:relative;overflow:hidden;aspect-ratio:3/2;background:#F0E8DF}
.team .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease)}
.team:hover .thumb img{transform:scale(1.05)}
.team .info{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.team .logo-img{height:22px;width:auto;align-self:flex-start}
.link{display:inline-flex;gap:8px;align-self:flex-start;margin-top:8px;border-bottom:1px solid currentColor;padding-bottom:2px}
.link .arrow{transition:transform .3s var(--ease)}
.team:hover .link{color:var(--nav)}
.team:hover .link .arrow{transform:translateX(4px)}
.empty{display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;border:1px dashed var(--line);color:var(--sub);font-size:14px;font-weight:100;letter-spacing:.1em}
</style>
</head>
<body>
<header class="header">
  <div class="container">
    <span class="logo">2030 FUTURE WORLD</span>
    <span class="temp">임시 프로젝트 페이지</span>
  </div>
</header>

<main class="container">
  <section class="intro">
    <p class="eyebrow">Project</p>
    <h1 class="h1">2030 FUTURE WORLD</h1>
    <p class="h2">프로젝트 소개</p>
    <p class="todo">내용 입력 필요 — 전체 프로젝트의 주제, 미래 세계관, 배경 및 핵심 개념</p>
  </section>

  <section>
    <div class="s-head"><h2 class="h2">TEAMS</h2><span class="eyebrow">조별 소개</span></div>
    <div class="teams">
      <a class="team" href="TEAM06/index.html">
        <div class="thumb"><img src="TEAM06/assets/images/team-hero.webp" alt="2030 동묘시장 입구"></div>
        <div class="info">
          <p class="eyebrow">TEAM 06</p>
          <img class="logo-img" src="TEAM06/assets/images/logo.png" alt="DONGMYO">
          <p class="h3">2030 동묘시장 · MCU AI SOCIETY</p>
          <span class="link">TEAM 06 페이지로 이동 <span class="arrow">→</span></span>
        </div>
      </a>
      <div class="empty">다른 조 — 최종 취합 시 추가</div>
    </div>
  </section>
</main>
<script>
/* 오프라인 점검: 사이트 폴더(글꼴·이미지 등)를 함께 불러오지 못했으면 안내 표시
   (예: 압축(zip)을 풀지 않고 안에서 바로 index.html을 연 경우) */
(function(){
  if (window.__TEAM06_ASSETS) return;
  var d = document.createElement('div');
  d.setAttribute('role','alert');
  d.style.cssText = 'position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2147483647;width:min(560px,calc(100% - 32px));box-sizing:border-box;padding:16px 20px;border-radius:12px;background:#2B2523;color:#fff;font:500 14px/1.65 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.28)';
  d.innerHTML = '<b style="font-weight:700">사이트 파일을 함께 불러오지 못했어요.</b><br>압축(zip) 파일을 먼저 <b style="font-weight:700">전체 압축 풀기</b> 한 뒤, 풀린 <b style="font-weight:700">2030-future-world</b> 폴더 안의 <b style="font-weight:700">index.html</b>을 열어 주세요.';
  document.body.appendChild(d);
})();
</script>
</body>
</html>
